[supervisord]
nodaemon=true
user=root
logfile=/app/data/trading_data/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
priority=10
autostart=true
autorestart=true
stdout_logfile=/app/data/trading_data/xvfb.log
stderr_logfile=/app/data/trading_data/xvfb.err

[program:fluxbox]
command=fluxbox -display :99
priority=20
autostart=true
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/app/data/trading_data/fluxbox.log
stderr_logfile=/app/data/trading_data/fluxbox.err

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 127.0.0.1
priority=30
autostart=true
autorestart=true
environment=DISPLAY=":99"
stdout_logfile=/app/data/trading_data/x11vnc.log
stderr_logfile=/app/data/trading_data/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 8080 127.0.0.1:5900
priority=40
autostart=true
autorestart=true
stdout_logfile=/app/data/trading_data/novnc.log
stderr_logfile=/app/data/trading_data/novnc.err

[program:bridge]
command=/bin/bash /app/docker/scripts/run_bridge_container.sh
priority=50
autostart=true
autorestart=true
environment=DISPLAY=":99",PYTHONIOENCODING="utf-8"
stdout_logfile=/app/data/trading_data/bridge.log
stderr_logfile=/app/data/trading_data/bridge.err

[program:auto_trader]
command=/bin/bash /app/docker/scripts/run_trader_container.sh
priority=60
autostart=true
autorestart=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/app/data/trading_data/auto_trader.log
stderr_logfile=/app/data/trading_data/auto_trader.err
